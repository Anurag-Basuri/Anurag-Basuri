name: Sync Profile & Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake Contribution Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Anurag-Basuri
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        continue-on-error: true

      - name: Deploy Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Anurag-Basuri
        continue-on-error: true

      - name: Commit 3D Contribution Graph
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A profile-3d-contrib/ || true
          git diff --cached --quiet || git commit -m "chore: update 3D contribution graph"
          git push || true
        continue-on-error: true
