<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
  <defs>
    <!-- Glow Filters -->
    <filter id="arcadeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="hudBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0.9"/>
    </linearGradient>

    <linearGradient id="hudBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#090d18;stop-opacity:0.98"/>
      <stop offset="100%" style="stop-color:#04060b;stop-opacity:0.98"/>
    </linearGradient>

    <linearGradient id="barHp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#38BDF8"/>
    </linearGradient>

    <linearGradient id="barMp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#C084FC"/>
    </linearGradient>

    <linearGradient id="barAtk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2D95"/>
      <stop offset="100%" style="stop-color:#FB7185"/>
    </linearGradient>

    <linearGradient id="barDef" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3FB950"/>
      <stop offset="100%" style="stop-color:#4ADE80"/>
    </linearGradient>

    <!-- CRT Scanlines Pattern -->
    <pattern id="crtScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/>
    </pattern>
  </defs>

  <style>
    .font-pixel { font-family: 'Fira Code', 'Courier New', monospace; }
    .font-hud { font-family: 'Segoe UI', system-ui, sans-serif; }

    .blink-cursor {
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .pulse-hud {
      animation: pulseAnim 3s ease-in-out infinite alternate;
    }
    @keyframes pulseAnim {
      0% { opacity: 0.75; transform: scale(0.995); }
      100% { opacity: 1; transform: scale(1.005); }
    }

    .heart-beat {
      animation: heartBeat 1.4s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }
  </style>

  <!-- Outer Frame -->
  <rect x="3" y="3" width="1094" height="314" rx="14" fill="url(#hudBg)" stroke="url(#hudBorder)" stroke-width="1.5"/>
  <rect x="3" y="3" width="1094" height="314" rx="14" fill="url(#crtScan)" pointer-events="none"/>

  <!-- Top Arcade Bar -->
  <g transform="translate(24, 28)">
    <!-- Header Icons & Player Name -->
    <text class="font-pixel" font-size="14" font-weight="900" fill="#00D4FF" letter-spacing="1">
      👾 PLAYER: <tspan fill="#FFFFFF">ANURAG.EXE</tspan>
    </text>
    <text class="font-pixel" font-size="12" font-weight="700" fill="#A855F7" x="250" y="0">
      [LVL 99 FULL-STACK ARCHITECT &amp; AI SUMMONER]
    </text>

    <!-- Top Right Arcade Telemetry -->
    <text class="font-pixel" font-size="11" font-weight="600" fill="#FF2D95" x="1050" y="0" text-anchor="end">
      INSERT COIN 🪙 // 100% READY TO DEPLOY
    </text>
  </g>

  <!-- ==================== LEFT COLUMN: RPG ATTRIBUTE BARS ==================== -->
  <g transform="translate(24, 64)">
    <!-- 1. RESILIENCE (HP) -->
    <g transform="translate(0, 16)">
      <text class="font-pixel" font-size="11" font-weight="700" fill="#3FB950" x="0" y="0">
        🛡️ SYSTEM RESILIENCE (HP)
      </text>
      <text class="font-pixel" font-size="11" font-weight="700" fill="#E6EDF3" x="480" y="0" text-anchor="end">
        100/100 [CIRCUIT BREAKER: ARMED]
      </text>
      <rect x="0" y="8" width="480" height="12" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="1" y="9" width="478" height="10" rx="2" fill="url(#barDef)"/>
    </g>

    <!-- 2. AI & LANGGRAPH MANA (MP) -->
    <g transform="translate(0, 58)">
      <text class="font-pixel" font-size="11" font-weight="700" fill="#A855F7" x="0" y="0">
        🧠 AI COGNITIVE MANA (MP)
      </text>
      <text class="font-pixel" font-size="11" font-weight="700" fill="#E6EDF3" x="480" y="0" text-anchor="end">
        95/100 [6-LAYER LLM CASCADE]
      </text>
      <rect x="0" y="8" width="480" height="12" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="1" y="9" width="455" height="10" rx="2" fill="url(#barMp)"/>
    </g>

    <!-- 3. BACKEND VELOCITY (SPEED) -->
    <g transform="translate(0, 100)">
      <text class="font-pixel" font-size="11" font-weight="700" fill="#00D4FF" x="0" y="0">
        ⚡ ASYNC VELOCITY (SPD)
      </text>
      <text class="font-pixel" font-size="11" font-weight="700" fill="#E6EDF3" x="480" y="0" text-anchor="end">
        99/100 [FASTAPI + SSE STREAM]
      </text>
      <rect x="0" y="8" width="480" height="12" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="1" y="9" width="472" height="10" rx="2" fill="url(#barHp)"/>
    </g>

    <!-- 4. ALGORITHM POWER (ATK) -->
    <g transform="translate(0, 142)">
      <text class="font-pixel" font-size="11" font-weight="700" fill="#FF2D95" x="0" y="0">
        ⚔️ ALGORITHM POWER (ATK)
      </text>
      <text class="font-pixel" font-size="11" font-weight="700" fill="#E6EDF3" x="480" y="0" text-anchor="end">
        550+ LEETCODE SOLVED (PEAK 1686)
      </text>
      <rect x="0" y="8" width="480" height="12" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="1" y="9" width="460" height="10" rx="2" fill="url(#barAtk)"/>
    </g>
  </g>

  <!-- ==================== VERTICAL DIVIDER ==================== -->
  <line x1="540" y1="65" x2="540" y2="280" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ==================== RIGHT COLUMN: INVENTORY EQUIPPED ==================== -->
  <g transform="translate(570, 75)">
    <text class="font-pixel" font-size="13" font-weight="800" fill="#00D4FF" letter-spacing="1">
      🎒 EQUIPPED INVENTORY &amp; SPELLS:
    </text>

    <!-- Spell 1: LangGraph Agent -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="235" height="42" rx="8" fill="#120e24" stroke="#A855F7" stroke-width="1"/>
      <text font-size="16" x="12" y="26">🧠</text>
      <text class="font-hud" font-size="11.5" font-weight="700" fill="#FFFFFF" x="38" y="18">LangGraph Agent</text>
      <text class="font-pixel" font-size="9.5" fill="#A855F7" x="38" y="32">ReAct Loop · 17 MCP Tools</text>
    </g>

    <!-- Spell 2: FastAPI Core -->
    <g transform="translate(250, 24)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#0b1720" stroke="#00D4FF" stroke-width="1"/>
      <text font-size="16" x="12" y="26">⚡</text>
      <text class="font-hud" font-size="11.5" font-weight="700" fill="#FFFFFF" x="38" y="18">FastAPI + Async Core</text>
      <text class="font-pixel" font-size="9.5" fill="#00D4FF" x="38" y="32">Sub-20ms P99 Latency</text>
    </g>

    <!-- Spell 3: Circuit Breakers -->
    <g transform="translate(0, 74)">
      <rect x="0" y="0" width="235" height="42" rx="8" fill="#0c1814" stroke="#3FB950" stroke-width="1"/>
      <text font-size="16" x="12" y="26">🛡️</text>
      <text class="font-hud" font-size="11.5" font-weight="700" fill="#FFFFFF" x="38" y="18">Circuit Breakers</text>
      <text class="font-pixel" font-size="9.5" fill="#3FB950" x="38" y="32">Zero-Crash Auto Failover</text>
    </g>

    <!-- Spell 4: PGVector RAG -->
    <g transform="translate(250, 74)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#1c0f1c" stroke="#FF2D95" stroke-width="1"/>
      <text font-size="16" x="12" y="26">🗄️</text>
      <text class="font-hud" font-size="11.5" font-weight="700" fill="#FFFFFF" x="38" y="18">Neon PGVector RAG</text>
      <text class="font-pixel" font-size="9.5" fill="#FF2D95" x="38" y="32">Encrypted Long-Term Memory</text>
    </g>

    <!-- Spell 5: Reactive Next.js 16 -->
    <g transform="translate(0, 124)">
      <rect x="0" y="0" width="490" height="38" rx="8" fill="#0d1117" stroke="#7873F5" stroke-width="1"/>
      <text font-size="15" x="12" y="24">✨</text>
      <text class="font-hud" font-size="11" font-weight="700" fill="#FFFFFF" x="36" y="16">Ultimate Quest:</text>
      <text class="font-pixel" font-size="10" fill="#C9D1D9" x="135" y="16">Building scalable, fault-tolerant intelligent systems.</text>
      <text class="font-pixel" font-size="9.5" fill="#00D4FF" x="36" y="30">READY FOR NEW CHALLENGES</text>
      <text class="blink-cursor" font-size="11" fill="#00D4FF" x="220" y="30">█</text>
    </g>
  </g>

  <!-- Bottom Mini Status Light -->
  <g transform="translate(24, 298)">
    <circle cx="6" cy="0" r="4" fill="#3FB950" class="heart-beat"/>
    <text class="font-pixel" font-size="10" fill="#8B949E" x="18" y="3">
      SESSION STATUS: CONNECTED // LATENCY: 12ms // ALL CORES ENGAGED
    </text>
  </g>
</svg>
