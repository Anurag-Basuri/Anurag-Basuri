<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420">
  <defs>
    
    <filter id="nodeGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    
    <linearGradient id="constBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060911"/>
      <stop offset="50%" style="stop-color:#0b111e"/>
      <stop offset="100%" style="stop-color:#060810"/>
    </linearGradient>

    
    <linearGradient id="synapseAItoBE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>

    <linearGradient id="synapseBEtoFE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#38BDF8"/>
    </linearGradient>

    <linearGradient id="synapseFEtoAI" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="50%" style="stop-color:#FF2D95"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>

    
    <radialGradient id="haloCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="haloPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="haloBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .font-sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    /* Keyframe Animations */
    .pulse-packet-1 {
      animation: pulseMove1 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes pulseMove1 {
      0% { stroke-dashoffset: 800; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .pulse-packet-2 {
      animation: pulseMove2 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 1.5s;
    }
    @keyframes pulseMove2 {
      0% { stroke-dashoffset: 800; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .pulse-packet-3 {
      animation: pulseMove3 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 0.8s;
    }
    @keyframes pulseMove3 {
      0% { stroke-dashoffset: 1000; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .rotate-ring-cw {
      transform-origin: center;
      animation: rotRing 20s linear infinite;
    }
    .rotate-ring-ccw {
      transform-origin: center;
      animation: rotRingRev 25s linear infinite;
    }
    @keyframes rotRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotRingRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    .node-breath {
      animation: nodePulse 3s ease-in-out infinite alternate;
    }
    @keyframes nodePulse {
      0% { transform: scale(0.98); opacity: 0.85; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    .star-flicker {
      animation: starAnim 3s infinite ease-in-out;
    }
    @keyframes starAnim {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.8; transform: scale(1.2); }
    }
  </style>

  
  <rect x="2" y="2" width="1096" height="416" rx="14" fill="url(#constBg)" stroke="#21262d" stroke-width="1.5"/>

  
  <g opacity="0.04" stroke="#00D4FF" stroke-width="0.5">
    <line x1="0" y1="70" x2="1100" y2="70"/>
    <line x1="0" y1="140" x2="1100" y2="140"/>
    <line x1="0" y1="210" x2="1100" y2="210"/>
    <line x1="0" y1="280" x2="1100" y2="280"/>
    <line x1="0" y1="350" x2="1100" y2="350"/>
    <line x1="180" y1="0" x2="180" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="550" y1="0" x2="550" y2="420"/>
    <line x1="730" y1="0" x2="730" y2="420"/>
    <line x1="910" y1="0" x2="910" y2="420"/>
  </g>

  
  <g fill="#00D4FF">
    <circle cx="90" cy="60" r="1.5" class="star-flicker" style="animation-delay: 0.2s;"/>
    <circle cx="430" cy="50" r="1.2" class="star-flicker" style="animation-delay: 1.1s;" fill="#A855F7"/>
    <circle cx="720" cy="40" r="1.5" class="star-flicker" style="animation-delay: 1.7s;" fill="#FF2D95"/>
    <circle cx="1020" cy="80" r="1.2" class="star-flicker" style="animation-delay: 0.5s;"/>
    <circle cx="150" cy="360" r="1.5" class="star-flicker" style="animation-delay: 2.1s;"/>
    <circle cx="850" cy="380" r="1.2" class="star-flicker" style="animation-delay: 0.9s;"/>
  </g>

  
  <g font-family="'Fira Code', monospace" font-size="11" letter-spacing="2">
    <text x="35" y="38" fill="#8B949E">
      <tspan fill="#00D4FF">TOPOLOGY:</tspan> TRI_TIER_NEURAL_CONSTELLATION
    </text>
    <text x="1065" y="38" text-anchor="end" fill="#3FB950">
      ● 3 NODES SYNCED // REAL-TIME EVENT BUS
    </text>
  </g>

  
  <g opacity="0.8">
     Backend Node (550, 140) -->
    <path d="M 220 240 Q 360 140 550 140" fill="none" stroke="#21262d" stroke-width="2"/>
    <path d="M 220 240 Q 360 140 550 140" fill="none" stroke="url(#synapseAItoBE)" stroke-width="2.5" stroke-dasharray="80 720" class="pulse-packet-1" filter="url(#nodeGlowPurple)"/>

     Frontend Node (880, 240) -->
    <path d="M 550 140 Q 740 140 880 240" fill="none" stroke="#21262d" stroke-width="2"/>
    <path d="M 550 140 Q 740 140 880 240" fill="none" stroke="url(#synapseBEtoFE)" stroke-width="2.5" stroke-dasharray="80 720" class="pulse-packet-2" filter="url(#nodeGlowCyan)"/>

     AI Node (220, 240) [Lower Arc] -->
    <path d="M 880 240 Q 550 360 220 240" fill="none" stroke="#21262d" stroke-width="2"/>
    <path d="M 880 240 Q 550 360 220 240" fill="none" stroke="url(#synapseFEtoAI)" stroke-width="2.5" stroke-dasharray="100 900" class="pulse-packet-3" filter="url(#nodeGlowPink)"/>

    
    
    <g transform="translate(350, 155)">
      <rect x="-55" y="-10" width="110" height="20" rx="4" fill="#0d1117" stroke="#A855F7" stroke-width="0.8" opacity="0.9"/>
      <text class="font-mono" font-size="9" fill="#E2E8F0" x="0" y="4" text-anchor="middle">Tool Invocations</text>
    </g>

    
