<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 120" width="1100" height="120">
  <defs>
    <linearGradient id="footLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0"/>
      <stop offset="25%" style="stop-color:#00D4FF;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#FF2D95;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0"/>
    </linearGradient>

    <filter id="footGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-foot-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .pulse-dot {
      animation: pDot 2s infinite ease-in-out;
    }
    @keyframes pDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Top Glowing Cyber Divider Line -->
  <rect x="50" y="20" width="1000" height="1.5" fill="url(#footLineGrad)"/>
  <circle cx="550" cy="20" r="4" fill="#00D4FF" filter="url(#footGlow)">
    <animate attributeName="cx" values="100;1000;100" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
  </circle>

  <!-- Center Dock Box -->
  <g transform="translate(550, 60)">
    <!-- Decorative Endpoint Brackets -->
    <text class="font-foot-mono" font-size="14" fill="#8B949E" x="-320" y="5" text-anchor="middle">
      &lt; ━━ ❖
    </text>
    <text class="font-foot-mono" font-size="14" fill="#8B949E" x="320" y="5" text-anchor="middle">
      ❖ ━━ &gt;
    </text>

    <!-- Center Mission Status -->
    <g transform="translate(-140, 0)">
      <circle cx="0" cy="0" r="4" fill="#3FB950" class="pulse-dot"/>
      <text class="font-foot-mono" font-size="12" font-weight="700" fill="#E6EDF3" x="14" y="4">
        MISSION: BUILDING THE FUTURE
      </text>
    </g>
    <text class="font-foot-mono" font-size="11" fill="#00D4FF" x="110" y="4">
      // READY FOR HIGH-IMPACT ROLES
    </text>
  </g>

  <!-- Bottom Coordinates -->
  <text class="font-foot-mono" font-size="10" fill="#6E7681" x="550" y="98" text-anchor="middle">
    SYS_SHUTDOWN: FALSE // 24/7 AI AGENT MONITORING ACTIVE
  </text>
</svg>
