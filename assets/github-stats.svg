<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 220" width="530" height="220">
  <defs>
    <linearGradient id="statsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0.8" />
    </linearGradient>

    <linearGradient id="statsBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c111c;stop-opacity:0.98" />
      <stop offset="100%" style="stop-color:#070a12;stop-opacity:0.98" />
    </linearGradient>

    <linearGradient id="barPy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#38BDF8"/>
    </linearGradient>
    <linearGradient id="barTs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#C084FC"/>
    </linearGradient>
    <linearGradient id="barOther" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2D95"/>
      <stop offset="100%" style="stop-color:#F43F5E"/>
    </linearGradient>
  </defs>

  <style>
    .f-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #00D4FF; }
    .f-label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #E6EDF3; }
    .f-val { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 700; fill: #00D4FF; }
    .f-rank { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 32px; font-weight: 900; fill: #A855F7; }
    .f-rank-lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #8B949E; letter-spacing: 1px; }

    .pulse-ring {
      animation: pulseR 3s infinite ease-in-out;
      transform-origin: 455px 75px;
    }
    @keyframes pulseR {
      0%, 100% { transform: scale(0.96); opacity: 0.7; }
      50% { transform: scale(1.04); opacity: 1; }
    }
  </style>

  <!-- Frame Background & Glow Border -->
  <rect x="2" y="2" width="526" height="216" rx="12" fill="url(#statsBg)" stroke="url(#statsBorder)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(24, 28)">
    <text class="f-title" x="0" y="0">⚡ GitHub Production Metrics</text>
  </g>

  <!-- Metrics Grid (Left Column) -->
  <g transform="translate(24, 60)">
    <!-- Metric 1: Commits -->
    <g transform="translate(0, 0)">
      <text font-size="14" x="0" y="0">🔥</text>
      <text class="f-label" x="22" y="-1">Total Contributions:</text>
      <text class="f-val" x="170" y="-1">600+ Commits</text>
    </g>

    <!-- Metric 2: Public Repos -->
    <g transform="translate(0, 26)">
      <text font-size="14" x="0" y="0">📦</text>
      <text class="f-label" x="22" y="-1">Public Repositories:</text>
      <text class="f-val" x="170" y="-1" fill="#A855F7">24 Active Repos</text>
    </g>

    <!-- Metric 3: Production Codebase -->
    <g transform="translate(0, 52)">
      <text font-size="14" x="0" y="0">🛡️</text>
      <text class="f-label" x="22" y="-1">Code Architecture:</text>
      <text class="f-val" x="170" y="-1" fill="#3FB950">Tri-Tier Decoupled</text>
    </g>

    <!-- Metric 4: AI & Agents -->
    <g transform="translate(0, 78)">
      <text font-size="14" x="0" y="0">🧠</text>
      <text class="f-label" x="22" y="-1">Orchestrated AI:</text>
      <text class="f-val" x="170" y="-1" fill="#FF2D95">LangGraph + 17 MCP</text>
    </g>
  </g>

  <!-- Rank Badge (Right Side) -->
  <g transform="translate(455, 75)" class="pulse-ring">
    <circle cx="0" cy="0" r="38" fill="#140d24" stroke="#A855F7" stroke-width="2"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#00D4FF" stroke-width="1" stroke-dasharray="6 4"/>
    <text class="f-rank" x="0" y="10" text-anchor="middle">A+</text>
    <text class="f-rank-lbl" x="0" y="24" text-anchor="middle">RANK</text>
  </g>

  <!-- Bottom Language Progress Bar -->
  <g transform="translate(24, 168)">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#8B949E" x="0" y="-8">TOP CORE STACK</text>
    
    <!-- Multi-Segment Bar -->
    <rect x="0" y="0" width="478" height="8" rx="4" fill="#1f293d"/>
    
    <!-- Python (45%) -->
    <rect x="0" y="0" width="215" height="8" rx="4" fill="url(#barPy)"/>
    <!-- TypeScript/JS (35%) -->
    <rect x="217" y="0" width="167" height="8" fill="url(#barTs)"/>
    <!-- SQL & Backend (20%) -->
    <rect x="386" y="0" width="92" height="8" rx="4" fill="url(#barOther)"/>

    <!-- Legend -->
    <g transform="translate(0, 24)" font-family="'Fira Code', monospace" font-size="10.5">
      <circle cx="4" cy="-4" r="3.5" fill="#00D4FF"/>
      <text x="12" y="0" fill="#E6EDF3">Python (45%)</text>

      <circle cx="160" cy="-4" r="3.5" fill="#A855F7"/>
      <text x="168" y="0" fill="#E6EDF3">TypeScript/React (35%)</text>

      <circle cx="360" cy="-4" r="3.5" fill="#FF2D95"/>
      <text x="368" y="0" fill="#E6EDF3">SQL/PG (20%)</text>
    </g>
  </g>
</svg>
