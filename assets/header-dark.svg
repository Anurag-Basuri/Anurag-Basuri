<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Multi-Layer Neon Glow Filters -->
    <filter id="neonCoreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hudGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#05070c" />
      <stop offset="60%" style="stop-color:#090d16" />
      <stop offset="100%" style="stop-color:#0f172a" />
    </linearGradient>

    <linearGradient id="nameTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F0FF" />
      <stop offset="45%" style="stop-color:#A855F7" />
      <stop offset="85%" style="stop-color:#FF2D95" />
      <stop offset="100%" style="stop-color:#00F0FF" />
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="12s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0.7" />
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0" />
      <stop offset="25%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#FF2D95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0" />
    </linearGradient>

    <radialGradient id="horizonGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    .hud-rotate-cw {
      transform-origin: 600px 145px;
      animation: rotCW 30s linear infinite;
    }
    .hud-rotate-ccw {
      transform-origin: 600px 145px;
      animation: rotCCW 22s linear infinite;
    }
    .hud-rotate-fast {
      transform-origin: 600px 145px;
      animation: rotCW 14s linear infinite;
    }

    @keyframes rotCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    .pulse-infinite {
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.65; }
      100% { opacity: 1; }
    }

    .grid-motion {
      animation: moveGrid 3s linear infinite;
    }
    @keyframes moveGrid {
      0% { transform: translateY(0px); opacity: 0.8; }
      100% { transform: translateY(30px); opacity: 0.8; }
    }

    .data-packet {
      animation: travelPacket 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes travelPacket {
      0% { stroke-dashoffset: 600; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .flicker-text {
      animation: textFlicker 6s infinite ease-in-out;
    }
    @keyframes textFlicker {
      0%, 100% { opacity: 1; }
      48% { opacity: 1; }
      50% { opacity: 0.85; }
      52% { opacity: 1; }
      80% { opacity: 1; }
      82% { opacity: 0.9; }
      84% { opacity: 1; }
    }

    .star-twinkle {
      animation: twinkle 2.5s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.3); }
    }
  </style>

  <!-- Deep Cyberspace Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- 🌌 Cyber Stars / Cosmic Nodes -->
  <g fill="#00D4FF">
    <circle cx="120" cy="50" r="1" class="star-twinkle" style="animation-delay: 0.2s;" />
    <circle cx="280" cy="90" r="1.5" class="star-twinkle" style="animation-delay: 1.1s;" fill="#FF2D95" />
    <circle cx="450" cy="40" r="1" class="star-twinkle" style="animation-delay: 0.7s;" />
    <circle cx="780" cy="65" r="1.2" class="star-twinkle" style="animation-delay: 1.8s;" fill="#A855F7" />
    <circle cx="980" cy="45" r="1" class="star-twinkle" style="animation-delay: 0.4s;" />
    <circle cx="1110" cy="80" r="1.5" class="star-twinkle" style="animation-delay: 1.4s;" fill="#00D4FF" />
    <circle cx="190" cy="160" r="1" class="star-twinkle" style="animation-delay: 2.1s;" />
    <circle cx="1040" cy="150" r="1.2" class="star-twinkle" style="animation-delay: 0.9s;" fill="#FF2D95" />
  </g>

  <!-- 🌐 3D Perspective Cyber Grid Horizon (Bottom Half) -->
  <g opacity="0.45">
    <!-- Horizon Background Glow -->
    <rect x="0" y="220" width="1200" height="140" fill="url(#horizonGlow)" />

    <!-- Vanishing Horizon Line -->
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#00D4FF" stroke-width="1" opacity="0.6" />

    <!-- Perspective Converging Lines (Radiating to Horizon center: 600, 240) -->
    <line x1="600" y1="240" x2="-200" y2="360" stroke="#00D4FF" stroke-width="0.8" opacity="0.4" />
    <line x1="600" y1="240" x2="50" y2="360" stroke="#00D4FF" stroke-width="0.8" opacity="0.5" />
    <line x1="600" y1="240" x2="220" y2="360" stroke="#00D4FF" stroke-width="0.9" opacity="0.6" />
    <line x1="600" y1="240" x2="380" y2="360" stroke="#A855F7" stroke-width="1" opacity="0.7" />
    <line x1="600" y1="240" x2="500" y2="360" stroke="#A855F7" stroke-width="1.1" opacity="0.8" />
    <line x1="600" y1="240" x2="600" y2="360" stroke="#00D4FF" stroke-width="1.2" opacity="0.9" />
    <line x1="600" y1="240" x2="700" y2="360" stroke="#A855F7" stroke-width="1.1" opacity="0.8" />
    <line x1="600" y1="240" x2="820" y2="360" stroke="#A855F7" stroke-width="1" opacity="0.7" />
    <line x1="600" y1="240" x2="980" y2="360" stroke="#00D4FF" stroke-width="0.9" opacity="0.6" />
    <line x1="600" y1="240" x2="1150" y2="360" stroke="#00D4FF" stroke-width="0.8" opacity="0.5" />
    <line x1="600" y1="240" x2="1400" y2="360" stroke="#00D4FF" stroke-width="0.8" opacity="0.4" />

    <!-- Moving Horizontal Grid Lines with Perspective Spacing -->
    <g class="grid-motion">
      <line x1="0" y1="250" x2="1200" y2="250" stroke="#00D4FF" stroke-width="0.5" opacity="0.3" />
      <line x1="0" y1="264" x2="1200" y2="264" stroke="#00D4FF" stroke-width="0.7" opacity="0.4" />
      <line x1="0" y1="282" x2="1200" y2="282" stroke="#A855F7" stroke-width="0.9" opacity="0.5" />
      <line x1="0" y1="306" x2="1200" y2="306" stroke="#A855F7" stroke-width="1.1" opacity="0.6" />
      <line x1="0" y1="336" x2="1200" y2="336" stroke="#00D4FF" stroke-width="1.4" opacity="0.8" />
    </g>
  </g>

  <!-- 🌀 Holographic Rotating HUD Geometric Rings (Behind Name) -->
  <g opacity="0.35" filter="url(#hudGlow)">
    <!-- Outer Segmented Ring -->
    <circle cx="600" cy="140" r="110" fill="none" stroke="#00D4FF" stroke-width="1" stroke-dasharray="12 8 30 8 4 8" class="hud-rotate-cw" />
    
    <!-- Middle Precision Compass Ring -->
    <circle cx="600" cy="140" r="85" fill="none" stroke="#A855F7" stroke-width="1" stroke-dasharray="8 14 2 14" class="hud-rotate-ccw" />
    
    <!-- Inner Crosshair Arc Ring -->
    <circle cx="600" cy="140" r="60" fill="none" stroke="#FF2D95" stroke-width="1.2" stroke-dasharray="40 50" class="hud-rotate-fast" />

    <!-- Radial Target Accents -->
    <g class="hud-rotate-cw">
      <line x1="600" y1="20" x2="600" y2="38" stroke="#00D4FF" stroke-width="1.5" />
      <line x1="600" y1="242" x2="600" y2="260" stroke="#00D4FF" stroke-width="1.5" />
      <line x1="480" y1="140" x2="498" y2="140" stroke="#00D4FF" stroke-width="1.5" />
      <line x1="702" y1="140" x2="720" y2="140" stroke="#00D4FF" stroke-width="1.5" />
    </g>
  </g>

  <!-- ⚡ Neural Circuit Traces with Glowing Data Packets -->
  <g opacity="0.7">
    <!-- Left Circuit Path -->
    <path id="leftCircuit1" d="M 50 140 L 220 140 L 280 90 L 400 90" fill="none" stroke="#30363d" stroke-width="1.5" />
    <path d="M 50 140 L 220 140 L 280 90 L 400 90" fill="none" stroke="#00D4FF" stroke-width="2" stroke-dasharray="60 540" class="data-packet" filter="url(#hudGlow)" />
    <circle cx="50" cy="140" r="3.5" fill="#00D4FF" />
    <circle cx="400" cy="90" r="3" fill="#00D4FF" />

    <!-- Left Circuit Path 2 -->
    <path d="M 90 210 L 200 210 L 260 170 L 370 170" fill="none" stroke="#30363d" stroke-width="1.5" />
    <path d="M 90 210 L 200 210 L 260 170 L 370 170" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="50 450" class="data-packet" style="animation-delay: 1.5s;" filter="url(#hudGlow)" />
    <circle cx="90" cy="210" r="3" fill="#A855F7" />
    <circle cx="370" cy="170" r="3" fill="#A855F7" />

    <!-- Right Circuit Path 1 -->
    <path d="M 1150 140 L 980 140 L 920 90 L 800 90" fill="none" stroke="#30363d" stroke-width="1.5" />
    <path d="M 1150 140 L 980 140 L 920 90 L 800 90" fill="none" stroke="#FF2D95" stroke-width="2" stroke-dasharray="60 540" class="data-packet" style="animation-delay: 0.8s;" filter="url(#hudGlow)" />
    <circle cx="1150" cy="140" r="3.5" fill="#FF2D95" />
    <circle cx="800" cy="90" r="3" fill="#FF2D95" />

    <!-- Right Circuit Path 2 -->
    <path d="M 1110 210 L 1000 210 L 940 170 L 830 170" fill="none" stroke="#30363d" stroke-width="1.5" />
    <path d="M 1110 210 L 1000 210 L 940 170 L 830 170" fill="none" stroke="#00D4FF" stroke-width="2" stroke-dasharray="50 450" class="data-packet" style="animation-delay: 2.2s;" filter="url(#hudGlow)" />
    <circle cx="1110" cy="210" r="3" fill="#00D4FF" />
    <circle cx="830" cy="170" r="3" fill="#00D4FF" />
  </g>

  <!-- 🎛️ Telemetry Sci-Fi Top Tags -->
  <g font-family="'Fira Code', monospace" font-size="11" fill="#8B949E" letter-spacing="2" opacity="0.8">
    <!-- Left Telemetry -->
    <text x="50" y="42">
      <tspan fill="#00D4FF">SYS_ID:</tspan> AB-9000 // CORE: ONLINE
    </text>
    
    <!-- Right Telemetry -->
    <text x="1150" y="42" text-anchor="end">
      <tspan fill="#A855F7">ARCH:</tspan> DISTRIBUTED_3TIER // V4.2
    </text>
  </g>

  <!-- 🛡️ Sci-Fi Tech Corner Brackets (Framing the Name) -->
  <g stroke="#00D4FF" stroke-width="1.5" fill="none" opacity="0.65" class="pulse-infinite">
    <!-- Top-Left Bracket -->
    <path d="M 330 90 L 310 90 L 310 110" />
    <!-- Top-Right Bracket -->
    <path d="M 870 90 L 890 90 L 890 110" />
    <!-- Bottom-Left Bracket -->
    <path d="M 310 170 L 310 190 L 330 190" />
    <!-- Bottom-Right Bracket -->
    <path d="M 890 170 L 890 190 L 870 190" />
  </g>

  <!-- 👑 Main Name Typography with Chromatic Neon Glow -->
  <!-- Layer 1: Diffuse Multi-Color Glow -->
  <g filter="url(#neonCoreGlow)" class="pulse-infinite">
    <text x="600" y="145" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="-0.5" fill="url(#nameTextGrad)">
      Anurag Basuri
    </text>
  </g>

  <!-- Layer 2: Ultra-Crisp Sharp Core Text -->
  <text x="600" y="145" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF" class="flicker-text">
    Anurag Basuri
  </text>

  <!-- 🏷️ Subtitle (Tracked Monospace Sci-Fi Aesthetic) -->
  <g font-family="'Fira Code', 'Segoe UI', system-ui, monospace" font-size="14" font-weight="600" letter-spacing="3" text-anchor="middle">
    <!-- Subtitle Glow Layer -->
    <text x="600" y="196" fill="#00D4FF" opacity="0.3" filter="url(#hudGlow)">
      FULL-STACK ENGINEER  ·  AI SYSTEMS
    </text>
    <!-- Subtitle Crisp Layer -->
    <text x="600" y="196" fill="#C9D1D9">
      <tspan fill="#00D4FF">FULL-STACK ENGINEER</tspan>  <tspan fill="#FF2D95">·</tspan>  <tspan fill="#A855F7">AI SYSTEMS</tspan>
    </text>
  </g>

  <!-- 🟢 Live Status Pill: OPEN TO OPPORTUNITIES -->
  <g transform="translate(480, 240)">
    <!-- Pill Background Frame -->
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#090d16" stroke="#00D4FF" stroke-width="1.2" stroke-opacity="0.6" filter="url(#hudGlow)" />
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#00D4FF" fill-opacity="0.06" />

    <!-- Pulsing Radar Indicator Dot -->
    <circle cx="20" cy="14" r="4" fill="#00D4FF">
      <animate attributeName="r" values="3.5;7;3.5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="20" cy="14" r="3.5" fill="#00D4FF" />

    <!-- Status Text -->
    <text x="34" y="18" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#E6EDF3" letter-spacing="1.5">
      OPEN TO OPPORTUNITIES
    </text>
  </g>

  <!-- ⚡ Bottom Laser Line with Scanner Flare -->
  <rect x="100" y="348" width="1000" height="1.5" fill="url(#laserBeam)" />
  <circle cx="600" cy="348" r="4" fill="#00D4FF" filter="url(#hudGlow)">
    <animate attributeName="cx" values="100;1100;100" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" />
  </circle>
</svg>
