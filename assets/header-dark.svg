<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Neon glow filter for the name -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for subtitle -->
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animated gradient for the mesh background -->
    <linearGradient id="meshGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.15">
        <animate attributeName="stop-opacity" values="0.15;0.25;0.15" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="stop-color" values="#00D4FF;#A855F7;#00D4FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:0.08">
        <animate attributeName="stop-opacity" values="0.08;0.18;0.08" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="stop-color" values="#A855F7;#FF2D95;#A855F7" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0.12">
        <animate attributeName="stop-opacity" values="0.12;0.22;0.12" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="stop-color" values="#FF2D95;#00D4FF;#FF2D95" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="meshGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF2D95;stop-opacity:0.1">
        <animate attributeName="stop-opacity" values="0.1;0.2;0.1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0.1">
        <animate attributeName="stop-opacity" values="0.1;0.18;0.1" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Radial glow orbs -->
    <radialGradient id="orb1" cx="25%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.2">
        <animate attributeName="stop-opacity" values="0.2;0.35;0.2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="orb2" cx="75%" cy="60%" r="30%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:0.15">
        <animate attributeName="stop-opacity" values="0.15;0.3;0.15" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="orb3" cx="50%" cy="30%" r="25%">
      <stop offset="0%" style="stop-color:#FF2D95;stop-opacity:0.1">
        <animate attributeName="stop-opacity" values="0.1;0.22;0.1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0"/>
    </radialGradient>

    <!-- Gradient for the name text -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#FF2D95"/>
    </linearGradient>

    <!-- Bottom fade line -->
    <linearGradient id="bottomLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#00D4FF;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:0.8"/>
      <stop offset="80%" style="stop-color:#FF2D95;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <style>
    @media (prefers-color-scheme: dark) {
      .bg-base { fill: #0d1117; }
      .name-text { fill: url(#nameGradient); }
      .subtitle-text { fill: #8B949E; }
      .accent-dot { fill: #00D4FF; }
    }
    @media (prefers-color-scheme: light) {
      .bg-base { fill: #ffffff; }
      .name-text { fill: #1a1a2e; }
      .subtitle-text { fill: #57606a; }
      .accent-dot { fill: #A855F7; }
    }

    .name-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .neon-pulse {
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .float-orb {
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(10px, -8px); }
      50% { transform: translate(-5px, 5px); }
      75% { transform: translate(8px, 3px); }
    }

    .scan-line {
      animation: scan 4s linear infinite;
    }

    @keyframes scan {
      0% { transform: translateX(-100px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(1300px); opacity: 0; }
    }

    .particle {
      animation: sparkle 3s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; r: 1; }
      50% { opacity: 0.8; r: 2; }
    }
  </style>

  <!-- Base background -->
  <rect class="bg-base" width="1200" height="320" rx="0"/>

  <!-- Gradient mesh layers -->
  <rect width="1200" height="320" fill="url(#meshGrad1)" class="neon-pulse"/>
  <rect width="1200" height="320" fill="url(#meshGrad2)"/>

  <!-- Floating glow orbs -->
  <g class="float-orb">
    <rect width="1200" height="320" fill="url(#orb1)"/>
  </g>
  <g class="float-orb" style="animation-delay: -3s; animation-duration: 10s;">
    <rect width="1200" height="320" fill="url(#orb2)"/>
  </g>
  <g class="float-orb" style="animation-delay: -5s; animation-duration: 7s;">
    <rect width="1200" height="320" fill="url(#orb3)"/>
  </g>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="320" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="320" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="320" stroke="#00D4FF" stroke-width="0.5"/>
  </g>

  <!-- Floating particles -->
  <circle class="particle" cx="150" cy="80" r="1.5" fill="#00D4FF" style="animation-delay: 0s;"/>
  <circle class="particle" cx="350" cy="200" r="1" fill="#A855F7" style="animation-delay: 0.5s;"/>
  <circle class="particle" cx="550" cy="60" r="1.5" fill="#FF2D95" style="animation-delay: 1s;"/>
  <circle class="particle" cx="750" cy="250" r="1" fill="#00D4FF" style="animation-delay: 1.5s;"/>
  <circle class="particle" cx="950" cy="120" r="1.5" fill="#A855F7" style="animation-delay: 2s;"/>
  <circle class="particle" cx="1050" cy="180" r="1" fill="#FF2D95" style="animation-delay: 2.5s;"/>
  <circle class="particle" cx="250" cy="260" r="1" fill="#00D4FF" style="animation-delay: 0.8s;"/>
  <circle class="particle" cx="850" cy="40" r="1.5" fill="#A855F7" style="animation-delay: 1.8s;"/>

  <!-- Scanning light beam -->
  <rect class="scan-line" x="0" y="0" width="100" height="320" fill="url(#meshGrad1)" opacity="0.15" rx="50"/>

  <!-- Main name text with neon glow -->
  <g filter="url(#neonGlow)" class="neon-pulse">
    <text x="600" y="125" text-anchor="middle" class="name-text" fill="url(#nameGradient)">
      Anurag Basuri
    </text>
  </g>
  <!-- Crisp overlay text (no blur) -->
  <text x="600" y="125" text-anchor="middle" class="name-text" fill="url(#nameGradient)">
    Anurag Basuri
  </text>

  <!-- Subtitle -->
  <text x="600" y="185" text-anchor="middle" class="subtitle-text">
    Full-Stack Engineer (Backend Focused)  ·  AI Systems
  </text>

  <!-- Accent dots flanking the subtitle -->
  <circle class="accent-dot neon-pulse" cx="310" cy="180" r="3" style="animation-delay: -1s;"/>
  <circle class="accent-dot neon-pulse" cx="890" cy="180" r="3" style="animation-delay: -2s;"/>

  <!-- Status indicator -->
  <g transform="translate(488, 245)">
    <circle cx="0" cy="0" r="4" fill="#00D4FF" opacity="0.4">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#00D4FF"/>
    <text x="14" y="5" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8B949E" letter-spacing="1">
      OPEN TO OPPORTUNITIES
    </text>
  </g>

  <!-- Bottom gradient line -->
  <rect x="100" y="305" width="1000" height="1.5" fill="url(#bottomLine)" rx="1">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
